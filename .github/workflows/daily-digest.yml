name: Daily Canvas Digest

on:
  schedule:
    # 11:17 UTC = 6:17 AM Central during Daylight Time (5:17 AM in winter;
    # cron is always UTC). An odd minute on purpose: GitHub delays
    # scheduled runs most at busy times like :00 and :30, and even so a
    # run can start hours late. Use "Run workflow" for an immediate run.
    - cron: "17 11 * * 1-5" # Mon-Fri only
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab to test
  push:
    branches: [dev]
    paths:
      - "syllabi/**" # rebuild right away when a syllabus is added/removed via GitHub's UI

permissions:
  contents: write # commits newly extracted syllabus data back to the repo
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # backstop if an API call ever hangs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compute Pages URL
        run: echo "PAGES_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"

      - name: Fetch Canvas data, build dashboard, send notification
        env:
          CANVAS_DOMAIN: ${{ secrets.CANVAS_DOMAIN }}
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          EXCLUDE_COURSE_IDS: ${{ vars.EXCLUDE_COURSE_IDS }}
          LOOKAHEAD_DAYS: ${{ vars.LOOKAHEAD_DAYS }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          REPO_BRANCH: ${{ github.ref_name }}
        run: python -m src.main

      # Saves new syllabus extractions (and removes ones whose syllabus was
      # deleted) so later runs reuse them instead of calling Gemini again.
      # Pushes made with the workflow's own token never trigger another
      # workflow run, so this can't loop back into the syllabi/** trigger.
      - name: Save extracted syllabus data
        run: |
          git add -A -- syllabi 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No syllabus data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Save extracted syllabus data"
          git pull --rebase
          git push

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build-and-notify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
